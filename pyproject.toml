[project]
name = "finans-mlops"
version = "0.1.0"
description = "Fiyat verisi ingestion pipeline (indir -> dogrula -> store -> anomali raporu)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.24",
    "pyarrow>=15",
    "pandera>=0.20",
    "yfinance>=0.2",
    "PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
