[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finans-mlops"
version = "0.3.0"
description = "Fiyat verisi ingestion + feature boru hatti + egitim/backtest/serving (veri -> features -> model -> backtest -> serving)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.24,<3.0",
    "pyarrow>=15",
    "pandera>=0.20",
    "yfinance>=0.2",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "mlflow>=2.14",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "streamlit>=1.35",
    "plotly>=5.20",
    "prefect>=3.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
