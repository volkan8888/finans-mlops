# Adim 10 (FAZ 8): GitHub Actions CI - lint + testler + docker derleme smoke
# Notlar:
# - torch CPU wheel'i once kurulur (GPU derlemesi indirmemek icin).
# - testler ag-bagimsizdir (sentetik veri); CI'da ek veri gerekmez.
# - docker job: imaji derler (push etmez; kimlik gerekir).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Torch (CPU) kurulumu
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Paket + dev bagimliliklari
        run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Testler
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-tests
    steps:
      - uses: actions/checkout@v4
      - name: Docker imaji derleme (push yok)
        run: docker build -t finans-mlops:ci .
